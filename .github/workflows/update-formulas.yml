name: Update formulas

# Point Formula/popcraft.rb at a published @popcraft/cli: read its npm tarball, compute SHA256, and commit.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "@popcraft/cli version, without the leading v (e.g. 0.7.0)"
        required: true
        type: string
  # Fired by the PopCraft release (getpopcraft/popcraft-app, .github/workflows/packages.yml) after npm publishes.
  # client_payload: { version: "0.7.0" }
  repository_dispatch:
    types: [release]

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Resolve version
        id: in
        env:
          V: ${{ github.event.client_payload.version || inputs.version }}
        run: |
          set -euo pipefail
          [ -n "$V" ] || { echo "no version provided" >&2; exit 1; }
          echo "version=${V#v}" >> "$GITHUB_OUTPUT"

      - name: Download the tarball and compute SHA256
        id: sha
        env:
          VERSION: ${{ steps.in.outputs.version }}
        run: |
          set -euo pipefail
          URL="https://registry.npmjs.org/@popcraft/cli/-/cli-${VERSION}.tgz"
          # npm can accept a publish minutes before it serves it: wait up to 30 minutes.
          for i in $(seq 1 60); do curl -fsSL -o cli.tgz "$URL" && break; [ "$i" = 60 ] && { echo "::error::$URL is not served"; exit 1; }; sleep 30; done
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "sha=$(sha256sum cli.tgz | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          rm cli.tgz

      - name: Update the formula
        env:
          VERSION: ${{ steps.in.outputs.version }}
          URL: ${{ steps.sha.outputs.url }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          set -euo pipefail
          sed -i -E "s|^  url \".*\"|  url \"${URL}\"|; s|^  sha256 \".*\"|  sha256 \"${SHA}\"|" Formula/popcraft.rb
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/popcraft.rb
          if git diff --staged --quiet; then
            echo "No formula changes (version may already be published)"
          else
            git commit -m "popcraft ${VERSION}"
            git push
          fi
