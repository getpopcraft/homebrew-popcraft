name: Update formulas

# Regenerate Formula/popcraft.rb for a PopCraft CLI release: download the binaries attached to this repo's v<version>
# release, compute SHA256, and commit. The release and the dispatch come from the PopCraft release
# (getpopcraft/popcraft-app, .github/workflows/packages.yml), which compiles the CLI with bun, apart from npm.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "popcraft version, without the leading v (e.g. 0.7.0)"
        required: true
        type: string
  # client_payload: { version: "0.7.0" }
  repository_dispatch:
    types: [release]

permissions:
  contents: write
  actions: write   # run Tests on the new formula (a push with GITHUB_TOKEN starts no workflow)

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Resolve version
        id: in
        env:
          V: ${{ github.event.client_payload.version || inputs.version }}
        run: |
          set -euo pipefail
          [ -n "$V" ] || { echo "no version provided" >&2; exit 1; }
          echo "version=${V#v}" >> "$GITHUB_OUTPUT"

      - name: Download the binaries and compute SHA256
        id: shas
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.in.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/popcraft
          for target in darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            name="popcraft-${VERSION}-${target}.tar.gz"
            gh release download "v${VERSION}" -R "$GITHUB_REPOSITORY" -p "$name" -D /tmp/popcraft --clobber
            echo "${target//-/_}=$(sha256sum "/tmp/popcraft/${name}" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          done

      - name: Regenerate the formula
        env:
          VERSION: ${{ steps.in.outputs.version }}
          BASE: https://github.com/${{ github.repository }}/releases/download/v${{ steps.in.outputs.version }}
          SHA_DARWIN_ARM64: ${{ steps.shas.outputs.darwin_arm64 }}
          SHA_DARWIN_X64: ${{ steps.shas.outputs.darwin_x64 }}
          SHA_LINUX_X64: ${{ steps.shas.outputs.linux_x64 }}
          SHA_LINUX_ARM64: ${{ steps.shas.outputs.linux_arm64 }}
        run: |
          set -euo pipefail
          cat > Formula/popcraft.rb << 'FORMULA'
          # typed: false
          # frozen_string_literal: true

          # The `popcraft` command line: one executable with the design kit inside (compiled with bun), no Node needed.
          # npm has the same CLI as @popcraft/cli. Written by .github/workflows/update-formulas.yml; don't edit by hand.
          class Popcraft < Formula
            desc "Command-line for PopCraft: edit .popcraft files, call the API, publish plugins"
            homepage "https://popcraft.app/docs/api/cli"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "BASE_PLACEHOLDER/popcraft-VERSION_PLACEHOLDER-darwin-arm64.tar.gz"
                sha256 "SHA_DARWIN_ARM64_PLACEHOLDER"
              end
              if Hardware::CPU.intel?
                url "BASE_PLACEHOLDER/popcraft-VERSION_PLACEHOLDER-darwin-x64.tar.gz"
                sha256 "SHA_DARWIN_X64_PLACEHOLDER"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "BASE_PLACEHOLDER/popcraft-VERSION_PLACEHOLDER-linux-arm64.tar.gz"
                sha256 "SHA_LINUX_ARM64_PLACEHOLDER"
              end
              if Hardware::CPU.intel?
                url "BASE_PLACEHOLDER/popcraft-VERSION_PLACEHOLDER-linux-x64.tar.gz"
                sha256 "SHA_LINUX_X64_PLACEHOLDER"
              end
            end

            def install
              bin.install "popcraft"
            end

            test do
              assert_equal version.to_s, shell_output("#{bin}/popcraft --version").strip
              system bin/"popcraft", "new", testpath/"t.popcraft", "--name", "Test"
              assert_path_exists testpath/"t.popcraft"
            end
          end
          FORMULA
          sed -i -e 's/^          //' \
            -e "s|VERSION_PLACEHOLDER|${VERSION}|g" \
            -e "s|BASE_PLACEHOLDER|${BASE}|g" \
            -e "s|SHA_DARWIN_ARM64_PLACEHOLDER|${SHA_DARWIN_ARM64}|g" \
            -e "s|SHA_DARWIN_X64_PLACEHOLDER|${SHA_DARWIN_X64}|g" \
            -e "s|SHA_LINUX_X64_PLACEHOLDER|${SHA_LINUX_X64}|g" \
            -e "s|SHA_LINUX_ARM64_PLACEHOLDER|${SHA_LINUX_ARM64}|g" \
            Formula/popcraft.rb

      - name: Commit
        env:
          VERSION: ${{ steps.in.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/popcraft.rb
          if git diff --staged --quiet; then
            echo "No formula changes (version may already be published)"
          else
            git commit -m "popcraft ${VERSION}"
            git push
          fi

      - name: Test the formula on every platform
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run tests.yml -R "$GITHUB_REPOSITORY" --ref main
